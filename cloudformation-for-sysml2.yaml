# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/goformation/master/schema/cloudformation.schema.json

AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Marketplace Service with Aurora PostgreSQL, ECS Fargate, HTTPS ALB, and Secrets Manager (Custom Defaults)

Parameters:
  CognitoDomainName:
    Type: String
    Default: "sysmlv2auth"
    Description: Domain prefix for Cognito User Pool domain (must be unique across AWS and contain only lowercase letters, numbers, and hyphens)
    AllowedPattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
    ConstraintDescription: "Must contain only lowercase letters, numbers, and hyphens, and cannot start or end with a hyphen"
  
  DBName:
    Type: String
    Default: sysml2
    Description: Name of the initial database (leave as sysml2 unless you have a specific reason to change it)
  DBPassword:
    Type: String
    NoEcho: true
    Default: mysecretpassword
    Description: Password for the database (stored in Secrets Manager) (leave as mysecretpassword unless you have a specific reason to change it)
  DBInstanceClass:
    Type: String
    Default: db.t3.medium
    Description: DB instance class (db.t3.medium is a good starting point)
  ECSImage:
    Type: String
    Description: Docker image for the SysMLv2 API server (leave as is stated)
    Default: '709825985650.dkr.ecr.us-east-1.amazonaws.com/sysml-at-your-service/sysml-at-your-service-image:0.1.0-20250606.1'
  DomainName:
    Type: String
    Description: Domain name for the application (must change to your own DNS domain)
    Default: 'sysml-v2-api.digitalthread.link'
  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for your domain (leave empty to auto-discover from domain name)
    Default: ""
  CognitoUserLimit:
    Type: Number
    Default: 5
    Description: Maximum number of users allowed in the Cognito User Pool
  MarketplaceProductCode:
    Type: String
    Description: AWS Marketplace Product Code for entitlement checking
    Default: ""
  AdminFullName:
    Type: String
    Default: "SysML v2 Administrator"
    Description: Full name for the initial admin user (displayed name, not login username)
  AdminEmail:
    Type: String
    Description: Email address for the initial admin user (enter your admin's own real email address). Necessary to receive the initial password.
  AdminPassword:
    Type: String
    NoEcho: true
    Description: Password for the initial admin user (leave empty to use temporary password via email). Resets any existing password.
    Default: ""
    MinLength: 0
    MaxLength: 256
  CertificateOption:
    Type: String
    Default: New
    AllowedValues: [Existing, New]
    Description: Choose to use an existing ACM certificate or request a new one (recommended to use New)
  ExistingCertificateArn:
    Type: String
    Description: ARN of an existing ACM certificate (required if CertificateOption is Existing)
    Default: ''
  HttpPort:
    Type: Number
    Default: 80
    Description: Port for HTTP listener (external ALB) (leave as 80)
  HttpsPort:
    Type: Number
    Default: 443
    Description: Port for HTTPS listener (external ALB) (leave as 443)
  AppPort:
    Type: Number
    Default: 9000
    Description: Port for application container (internal) (leave as 9000)
  PostgresPort:
    Type: Number
    Default: 5432
    Description: Port for PostgreSQL database (internal) (leave as 5432)
  SecretsOption:
    Type: String
    Default: CreateNew
    AllowedValues: [CreateNew, UseExisting]
    Description: Choose to create a new secret or use an existing one for database credentials (recommended to use CreateNew)
  ExistingSecretArn:
    Type: String
    Description: ARN of an existing secret (required if SecretsOption is UseExisting)
    Default: 'arn:aws:secretsmanager:us-east-1:123456789012:secret:dummy'

Mappings:
  RegionToHostedZoneId:
    us-east-1:
      APIGateway: Z1UJRXOUMOOFQ8
    us-east-2:
      APIGateway: ZOJJZC49E0EPZ
    us-west-1:
      APIGateway: Z2MUQ32089INYE
    us-west-2:
      APIGateway: Z2OJLYMUO9EFXC
    ca-central-1:
      APIGateway: Z19DQILCV0OWEC
    eu-west-1:
      APIGateway: ZLY8HYME6SFDD
    eu-west-2:
      APIGateway: ZJ5UAJN8Y3Z2Q
    eu-west-3:
      APIGateway: Z3KY65QIEKYHQQ
    eu-central-1:
      APIGateway: Z1U9ULNL0V5AJ3
    # Add other regions as needed
    # CloudFront is global and always uses this ID
    global:
      CloudFront: Z2FDTNDATAQYW2

Conditions:
  CreateNewSecret: !Equals [!Ref SecretsOption, CreateNew]
  UseExistingCertificate: !Equals [!Ref CertificateOption, Existing]
  CreateNewCertificate: !Equals [!Ref CertificateOption, New]
  EnableMarketplaceCheck: !Not [!Equals [!Ref MarketplaceProductCode, ""]]
  AutoDiscoverHostedZone: !Equals [!Ref HostedZoneId, ""]

Resources:
  # VPC - Virtual Private Cloud
  # Purpose: Creates isolated network environment for all resources
  # Depends on: None (foundational resource)
  # Dependents: All subnet, security group, and networking resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: AppVPC

  # PublicSubnet1 - First public subnet in AZ1
  # Purpose: Hosts ALB and provides internet access for ECS tasks
  # Depends on: VPC
  # Dependents: ALB, ECS Service, PublicSubnetRouteTableAssociation1
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet1

  # PublicSubnet2 - Second public subnet in AZ2
  # Purpose: Provides high availability for ALB and ECS tasks
  # Depends on: VPC
  # Dependents: ALB, ECS Service, PublicSubnetRouteTableAssociation2
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet2

  # PrivateSubnet1 - First private subnet in AZ1
  # Purpose: Hosts Aurora database instances (no internet access)
  # Depends on: VPC
  # Dependents: DBSubnetGroup, AuroraCluster
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet1

  # PrivateSubnet2 - Second private subnet in AZ2
  # Purpose: Provides high availability for Aurora database
  # Depends on: VPC
  # Dependents: DBSubnetGroup, AuroraCluster
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet2

  # InternetGateway - Provides internet access to VPC
  # Dependents: AttachGateway, PublicRoute
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: AppIGW

  # AttachGateway - Attaches internet gateway to VPC
  # Depends on: VPC, InternetGateway
  # Dependents: PublicRoute
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # PublicRouteTable - Route table for public subnets
  # Depends on: VPC
  # Dependents: PublicRoute, PublicSubnetRouteTableAssociation1, PublicSubnetRouteTableAssociation2
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicRouteTable

  # PublicRoute - Route to internet gateway for public subnets
  # Depends on: AttachGateway, PublicRouteTable, InternetGateway
  # Dependents: PublicSubnetRouteTableAssociation1, PublicSubnetRouteTableAssociation2
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # PublicSubnetRouteTableAssociation1 - Associates PublicSubnet1 with public route table
  # Depends on: PublicRoute, PublicSubnet1, PublicRouteTable
  # Dependents: ApplicationLoadBalancer
  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn: PublicRoute
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  # PublicSubnetRouteTableAssociation2 - Associates PublicSubnet2 with public route table
  # Depends on: PublicRoute, PublicSubnet2, PublicRouteTable
  # Dependents: ApplicationLoadBalancer
  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn: PublicRoute
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # DBSubnetGroup - Subnet group for Aurora database cluster
  # Depends on: PrivateSubnet1, PrivateSubnet2
  # Dependents: AuroraCluster, AuroraInstance
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # DBSecurityGroup - Security group allowing ECS access to Aurora database
  # Depends on: VPC, ECSSecurityGroup
  # Dependents: AuroraCluster
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora cluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref PostgresPort
          ToPort: !Ref PostgresPort
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # DatabaseSecret - Stores Aurora database credentials securely
  # Dependents: AuroraCluster, TaskDefinition, ECSTaskRole
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateNewSecret
    Properties:
      Description: Credentials for Aurora PostgreSQL database
      SecretString: !Sub '{"username": "postgres", "password": "${DBPassword}"}'
      Tags:
        - Key: Name
          Value: AuroraDBCredentials

  # AuroraCluster - PostgreSQL Aurora database cluster
  # Depends on: DBSubnetGroup, DBSecurityGroup, DatabaseSecret (conditional)
  # Dependents: AuroraInstance, TaskDefinition
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '13.12'
      MasterUsername: !If 
        - CreateNewSecret
        - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
        - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:username}}'
      MasterUserPassword: !If 
        - CreateNewSecret
        - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
        - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:password}}'
      DatabaseName: !Ref DBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 03:00-04:00
      PreferredMaintenanceWindow: sun:05:00-sun:06:00
      Port: !Ref PostgresPort

  # AuroraInstance - Aurora database instance within the cluster
  # Depends on: AuroraCluster, DBSubnetGroup
  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: !Ref DBInstanceClass
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false

  # NewCertificate - SSL certificate for custom domains
  # Depends on: HostedZoneDiscovery (conditional)
  # Dependents: HTTPSListener, WebCloudFrontDistribution, APIGatewayDomain, OIDCProxyDomain
  NewCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateNewCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "web.${DomainName}"
        - !Sub "*.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If
            - AutoDiscoverHostedZone
            - !GetAtt HostedZoneDiscovery.HostedZoneId
            - !Ref HostedZoneId
        - DomainName: !Sub "web.${DomainName}"
          HostedZoneId: !If
            - AutoDiscoverHostedZone
            - !GetAtt HostedZoneDiscovery.HostedZoneId
            - !Ref HostedZoneId
        - DomainName: !Sub "auth.${DomainName}"
          HostedZoneId: !If
            - AutoDiscoverHostedZone
            - !GetAtt HostedZoneDiscovery.HostedZoneId
            - !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-Certificate"

  # ECSSecurityGroup - Security group for ECS tasks allowing ALB access
  # Depends on: VPC, ALBSecurityGroup
  # Dependents: DBSecurityGroup, ECSService, TaskDefinition
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ALBSecurityGroup - Security group for Application Load Balancer allowing HTTP/HTTPS traffic
  # Depends on: VPC
  # Dependents: ECSSecurityGroup, ApplicationLoadBalancer
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref HttpPort
          ToPort: !Ref HttpPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref HttpsPort
          ToPort: !Ref HttpsPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  # ECSCluster - ECS cluster to host Fargate tasks
  # Dependents: ECSService, TaskDefinition, MarketplaceEntitlementLambda
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: AppCluster

  # ECSLogGroup - CloudWatch log group for ECS container logs
  # Dependents: TaskDefinition
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/sysml-v2-api
      RetentionInDays: 14

  # TaskDefinition - ECS task definition for SysML v2 API application
  # Depends on: ECSExecutionRole, ECSTaskRole, ECSLogGroup, AuroraCluster, DatabaseSecret
  # Dependents: ECSService
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: app-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: app-container
          Image: !Ref ECSImage
          PortMappings:
            - ContainerPort: !Ref AppPort
              HostPort: !Ref AppPort
          Environment:
            - Name: DB_HOST
              Value: !GetAtt AuroraCluster.Endpoint.Address
            - Name: DB_PORT
              Value: !Ref PostgresPort
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: !If 
                - CreateNewSecret
                - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
                - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:username}}'
            - Name: DB_PASSWORD
              Value: !If 
                - CreateNewSecret
                - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
                - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:password}}'
            - Name: JAVA_OPTS
              Value: !If
                - CreateNewSecret
                - !Sub "-Ddb.host=${AuroraCluster.Endpoint.Address} -Ddb.port=${PostgresPort} -Ddb.name=${DBName} -Ddb.user={{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}} -Ddb.password={{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
                - !Sub "-Ddb.host=${AuroraCluster.Endpoint.Address} -Ddb.port=${PostgresPort} -Ddb.name=${DBName} -Ddb.user={{resolve:secretsmanager:${ExistingSecretArn}:SecretString:username}} -Ddb.password={{resolve:secretsmanager:${ExistingSecretArn}:SecretString:password}}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: sysml-v2-api

  # ECSExecutionRole - IAM role for ECS task execution (pulling images, logging)
  # Dependents: TaskDefinition
  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ECSTaskRole - IAM role for ECS tasks to access RDS and Secrets Manager
  # Depends on: AuroraCluster, DatabaseSecret
  # Dependents: TaskDefinition
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowRDSAndSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds:*
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !If 
                  - CreateNewSecret
                  - !Ref DatabaseSecret
                  - !Ref ExistingSecretArn
        - PolicyName: AllowECSExec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  # ECSService - ECS service running SysML v2 API application
  # Depends on: HTTPSListener, ECSCluster, TaskDefinition, PublicSubnet1, PublicSubnet2, ECSSecurityGroup, TargetGroup
  # Dependents: MarketplaceEntitlementLambda
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: HTTPSListener
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: AppService
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: app-container
          ContainerPort: !Ref AppPort
          TargetGroupArn: !Ref TargetGroup

  # ApplicationLoadBalancer - Load balancer for web traffic and API Gateway backend
  # Depends on: PublicSubnetRouteTableAssociation1, PublicSubnetRouteTableAssociation2, PublicSubnet1, PublicSubnet2, ALBSecurityGroup
  # Dependents: HTTPSListener, HTTPListener, HTTPListenerAPIGateway, TargetGroup, WebCloudFrontDistribution, APIGatewayProxyMethod
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: 
      - PublicSubnetRouteTableAssociation1
      - PublicSubnetRouteTableAssociation2
    Properties:
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Type: application

  # TargetGroup - Target group for ECS tasks behind the load balancer
  # Depends on: VPC
  # Dependents: ECSService, HTTPSListener, HTTPListenerAPIGateway
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: !Ref AppPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckPort: !Sub '${AppPort}'
      HealthCheckIntervalSeconds: 300
      HealthCheckTimeoutSeconds: 60
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      Matcher:
        HttpCode: 200-499
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 600
        - Key: slow_start.duration_seconds
          Value: 300

      
  # OIDCConfigLambdaRole - IAM role for OIDC configuration Lambda function
  # Dependents: OIDCConfigLambda
  OIDCConfigLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # OIDCConfigLambda - Lambda function serving OIDC discovery configuration
  # Depends on: OIDCConfigLambdaRole, UserPool
  # Dependents: OIDCProxyConfigMethod, OIDCConfigLambdaPermission
  OIDCConfigLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-oidc-config'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt OIDCConfigLambdaRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          REGION: !Ref AWS::Region
          DOMAIN_NAME: !Sub "auth.${DomainName}"
          COGNITO_DOMAIN: !Sub "${CognitoDomainName}.auth.${AWS::Region}.amazoncognito.com"
      Code:
        ZipFile: |
          import json
          import os
          
          def lambda_handler(event, context):
              region = os.environ['REGION']
              user_pool_id = os.environ['USER_POOL_ID']
              domain_name = os.environ['DOMAIN_NAME']
              cognito_domain = os.environ['COGNITO_DOMAIN']
              
              # Create the OIDC configuration
              config = {
                  "issuer": f"https://{cognito_domain}",
                  "authorization_endpoint": f"https://{domain_name}/oauth2/authorize",
                  "token_endpoint": f"https://{domain_name}/oauth2/token",
                  "userinfo_endpoint": f"https://{domain_name}/oauth2/userInfo",
                  "jwks_uri": f"https://cognito-idp.{region}.amazonaws.com/{user_pool_id}/.well-known/jwks.json",
                  "response_types_supported": ["code", "token", "id_token", "code token", "code id_token", "token id_token", "code token id_token"],
                  "subject_types_supported": ["public"],
                  "id_token_signing_alg_values_supported": ["RS256"],
                  "scopes_supported": ["openid", "email", "phone", "profile"],
                  "token_endpoint_auth_methods_supported": ["client_secret_basic", "client_secret_post"],
                  "claims_supported": ["sub", "aud", "email", "email_verified", "phone_number", "phone_number_verified", "name", "profile", "given_name", "family_name", "middle_name", "nickname", "preferred_username", "updated_at"]
              }
              
              return {
                  'statusCode': 200,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*'
                  },
                  'body': json.dumps(config)
              }

  # CognitoDomain - Cognito User Pool domain for authentication
  # Depends on: UserPool
  # Dependents: HTTPSListener
  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainName
      UserPoolId: !Ref UserPool

  # ALBAuthenticationRole - IAM role for ALB Cognito authentication
  # Depends on: UserPool
  ALBAuthenticationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticloadbalancing.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:GetSigningCertificate
                  - cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt UserPool.Arn

  # HTTPSListener - HTTPS listener with Cognito authentication for web traffic
  # Depends on: CognitoDomain, OIDCProxyDomain, ApplicationLoadBalancer, NewCertificate, UserPool, UserPoolClient, TargetGroup
  # Dependents: ECSService
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - CognitoDomain
      - OIDCProxyDomain
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref HttpsPort
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If
            - UseExistingCertificate
            - !Ref ExistingCertificateArn
            - !Ref NewCertificate
      DefaultActions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !GetAtt UserPool.Arn
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Ref CognitoDomainName
            OnUnauthenticatedRequest: authenticate
            SessionCookieName: AWSELBAuthSessionCookie
            SessionTimeout: 3600
            Scope: "openid email profile"
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref TargetGroup

  # HTTPListener - HTTP listener redirecting to HTTPS
  # Depends on: ApplicationLoadBalancer
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref HttpPort
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: !Sub '${HttpsPort}'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  # HTTPListenerAPIGateway - HTTP listener for API Gateway backend (no authentication)
  # Depends on: ApplicationLoadBalancer, TargetGroup
  # Dependents: APIGatewayProxyMethod
  HTTPListenerAPIGateway:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # HostedZoneDiscoveryRole - IAM role for hosted zone discovery Lambda
  # Dependents: HostedZoneDiscoveryLambda
  HostedZoneDiscoveryRole:
    Type: AWS::IAM::Role
    Condition: AutoDiscoverHostedZone
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Route53Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                Resource: '*'

  # HostedZoneDiscoveryLambda - Lambda function to auto-discover Route53 hosted zone
  # Depends on: HostedZoneDiscoveryRole
  # Dependents: HostedZoneDiscovery
  HostedZoneDiscoveryLambda:
    Type: AWS::Lambda::Function
    Condition: AutoDiscoverHostedZone
    Properties:
      FunctionName: !Sub '${AWS::StackName}-hosted-zone-discovery'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt HostedZoneDiscoveryRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          def lambda_handler(event, context):
              route53 = boto3.client('route53')
              
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      domain_name = event['ResourceProperties']['DomainName']
                      
                      # Extract base domain (e.g., digitalthread.link from sysml-v2-api.digitalthread.link)
                      parts = domain_name.split('.')
                      if len(parts) >= 2:
                          base_domain = '.'.join(parts[-2:]) + '.'
                      else:
                          base_domain = domain_name + '.'
                      
                      # List hosted zones and find matching one
                      response = route53.list_hosted_zones()
                      
                      for zone in response['HostedZones']:
                          if zone['Name'] == base_domain:
                              hosted_zone_id = zone['Id'].split('/')[-1]
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, 
                                             {'HostedZoneId': hosted_zone_id})
                              return
                      
                      # If no zone found, return error
                      cfnresponse.send(event, context, cfnresponse.FAILED, 
                                     {}, f'No hosted zone found for domain {base_domain}')
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  # HostedZoneDiscovery - Custom resource to discover hosted zone ID from domain name
  # Depends on: HostedZoneDiscoveryLambda
  # Dependents: NewCertificate, DNSRecordAPI, DNSRecordWeb, DNSRecordAuth
  HostedZoneDiscovery:
    Type: AWS::CloudFormation::CustomResource
    Condition: AutoDiscoverHostedZone
    Properties:
      ServiceToken: !GetAtt HostedZoneDiscoveryLambda.Arn
      DomainName: !Ref DomainName

  # APIGatewayDomain - Custom domain for API Gateway with SSL certificate
  # Depends on: NewCertificate
  # Dependents: APIGatewayBasePathMapping, DNSRecordAPI
  APIGatewayDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !If
        - UseExistingCertificate
        - !Ref ExistingCertificateArn
        - !Ref NewCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: TLS_1_2

  # APIGatewayBasePathMapping - Maps custom domain to API Gateway stage
  # Depends on: APIGatewayDeployment, APIGatewayDomain, APIGateway
  APIGatewayBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: APIGatewayDeployment
    Properties:
      DomainName: !Ref APIGatewayDomain
      RestApiId: !Ref APIGateway
      Stage: prod

  # DNSRecordAPI - DNS record pointing main domain to API Gateway
  # Depends on: APIGatewayDomain, HostedZoneDiscovery
  DNSRecordAPI:
    Type: AWS::Route53::RecordSet
    DependsOn: APIGatewayDomain
    Properties:
      HostedZoneId: !If
        - AutoDiscoverHostedZone
        - !GetAtt HostedZoneDiscovery.HostedZoneId
        - !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt APIGatewayDomain.RegionalDomainName
        HostedZoneId: !GetAtt APIGatewayDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  # URLRewriteFunction - CloudFront function to rewrite /docs URLs
  # Dependents: WebCloudFrontDistribution
  URLRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: "Function to handle URL rewrites for /docs endpoint"
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          
          // Handle /docs endpoint (without trailing slash)
          if (uri === '/docs') {
            request.uri = '/docs/';
          }
          
          return request;
        }

  # WebCloudFrontDistribution - CloudFront distribution for web interface
  # Depends on: NewCertificate, ApplicationLoadBalancer, URLRewriteFunction
  # Dependents: DNSRecordWeb
  WebCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        ViewerCertificate:
          AcmCertificateArn: !If
            - UseExistingCertificate
            - !Ref ExistingCertificateArn
            - !Ref NewCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            Headers: ["*"]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt URLRewriteFunction.FunctionARN
        Aliases:
          - !Sub "web.${DomainName}"

  # DNSRecordWeb - DNS record pointing web subdomain to CloudFront
  # Depends on: WebCloudFrontDistribution, HostedZoneDiscovery
  DNSRecordWeb:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - AutoDiscoverHostedZone
        - !GetAtt HostedZoneDiscovery.HostedZoneId
        - !Ref HostedZoneId
      Name: !Sub "web.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebCloudFrontDistribution.DomainName
        HostedZoneId: !FindInMap [RegionToHostedZoneId, global, CloudFront]
        EvaluateTargetHealth: false

  # MarketplaceEntitlementLambdaRole - IAM role for marketplace entitlement Lambda
  # Dependents: MarketplaceEntitlementLambda
  MarketplaceEntitlementLambdaRole:
    Type: AWS::IAM::Role
    Condition: EnableMarketplaceCheck
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MarketplaceAndECSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aws-marketplace:GetEntitlements
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'

  # MarketplaceEntitlementLambda - Lambda function to check marketplace entitlements
  # Depends on: MarketplaceEntitlementLambdaRole, ECSCluster, ECSService
  # Dependents: MarketplaceEntitlementSchedule, MarketplaceEntitlementLambdaPermission
  MarketplaceEntitlementLambda:
    Type: AWS::Lambda::Function
    Condition: EnableMarketplaceCheck
    Properties:
      FunctionName: !Sub '${AWS::StackName}-marketplace-entitlement-check'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt MarketplaceEntitlementLambdaRole.Arn
      Environment:
        Variables:
          PRODUCT_CODE: !Ref MarketplaceProductCode
          ECS_CLUSTER: !Ref ECSCluster
          ECS_SERVICE: !Ref ECSService
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          def lambda_handler(event, context):
              marketplace = boto3.client('marketplace-entitlement')
              ecs = boto3.client('ecs')
              
              product_code = os.environ['PRODUCT_CODE']
              cluster_name = os.environ['ECS_CLUSTER']
              service_name = os.environ['ECS_SERVICE']
              
              try:
                  # Check entitlements
                  response = marketplace.get_entitlements(ProductCode=product_code)
                  has_entitlement = len(response.get('Entitlements', [])) > 0
                  
                  # Get current service status
                  service_response = ecs.describe_services(
                      cluster=cluster_name,
                      services=[service_name]
                  )
                  
                  current_count = service_response['services'][0]['desiredCount']
                  
                  if has_entitlement and current_count == 0:
                      # Resume service
                      ecs.update_service(
                          cluster=cluster_name,
                          service=service_name,
                          desiredCount=1
                      )
                      print('Service resumed - valid entitlement found')
                  elif not has_entitlement and current_count > 0:
                      # Suspend service
                      ecs.update_service(
                          cluster=cluster_name,
                          service=service_name,
                          desiredCount=0
                      )
                      print('Service suspended - no valid entitlement')
                  
                  return {'statusCode': 200, 'body': json.dumps('Entitlement check completed')}
              except Exception as e:
                  print(f'Error: {str(e)}')
                  raise e

  # MarketplaceEntitlementSchedule - CloudWatch Events rule to trigger entitlement checks
  # Depends on: MarketplaceEntitlementLambda
  # Dependents: MarketplaceEntitlementLambdaPermission
  MarketplaceEntitlementSchedule:
    Type: AWS::Events::Rule
    Condition: EnableMarketplaceCheck
    Properties:
      Description: 'Trigger marketplace entitlement check every hour'
      ScheduleExpression: 'rate(1 hour)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt MarketplaceEntitlementLambda.Arn
          Id: 'MarketplaceEntitlementTarget'

  # MarketplaceEntitlementLambdaPermission - Permission for CloudWatch Events to invoke Lambda
  # Depends on: MarketplaceEntitlementLambda, MarketplaceEntitlementSchedule
  MarketplaceEntitlementLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: EnableMarketplaceCheck
    Properties:
      FunctionName: !Ref MarketplaceEntitlementLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MarketplaceEntitlementSchedule.Arn

  # CognitoPreSignUpLambdaRole - IAM role for Cognito pre-signup Lambda
  # Dependents: CognitoPreSignUpLambda
  CognitoPreSignUpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUserPoolAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  # CognitoPreSignUpLambda - Lambda function to enforce user limits during signup
  # Depends on: CognitoPreSignUpLambdaRole
  # Dependents: CognitoPreSignUpLambdaPermission
  CognitoPreSignUpLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-cognito-presignup'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt CognitoPreSignUpLambdaRole.Arn
      Environment:
        Variables:
          USER_LIMIT: !Ref CognitoUserLimit
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          def lambda_handler(event, context):
              cognito = boto3.client('cognito-idp')
              user_pool_id = event['userPoolId']
              user_limit = int(os.environ['USER_LIMIT'])
              
              try:
                  response = cognito.list_users(UserPoolId=user_pool_id)
                  current_user_count = len(response['Users'])
                  
                  if current_user_count >= user_limit:
                      raise Exception(f'User limit of {user_limit} has been reached')
                  
                  return event
              except Exception as e:
                  print(f'Error: {str(e)}')
                  raise e

  # CognitoPreSignUpLambdaPermission - Permission for Cognito to invoke pre-signup Lambda
  # Depends on: CognitoPreSignUpLambda, UserPool
  CognitoPreSignUpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CognitoPreSignUpLambda
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn
        
  # UserPool - Cognito User Pool for user authentication
  # Dependents: CognitoDomain, UserPoolClient, UserPoolClientAPI, HTTPSListener, OIDCConfigLambda, ALBAuthorizerLambda, AdminUser, CognitoPreSignUpLambdaPermission, DNSRecordAuth, OIDCProxyLambda
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-UserPool"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailMessage: "Your SysML v2 API username is {username} and temporary password is {####}. Please login and change your password."
          EmailSubject: "Your SysML v2 API temporary password"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  # UserPoolClient - Cognito User Pool client for ALB authentication
  # Depends on: UserPool
  # Dependents: HTTPSListener
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-ALB-Client"
      GenerateSecret: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: 
        - !Sub "https://${DomainName}/oauth2/idpresponse"
        - !Sub "https://web.${DomainName}/oauth2/idpresponse"
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
          
  # DNSRecordAuth - DNS record pointing auth subdomain to OIDC proxy API Gateway
  # Depends on: OIDCProxyDomain, HostedZoneDiscovery
  DNSRecordAuth:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - AutoDiscoverHostedZone
        - !GetAtt HostedZoneDiscovery.HostedZoneId
        - !Ref HostedZoneId
      Name: !Sub "auth.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt OIDCProxyDomain.RegionalDomainName
        HostedZoneId: !GetAtt OIDCProxyDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false
        
  # No need for domain verification since we're using a default Cognito domain
      
  # OIDCProxyAPI - API Gateway for OIDC and OAuth2 endpoint proxying
  # Dependents: OIDCProxyWellKnownResource, OIDCProxyOAuth2Resource, OIDCProxyConfigMethod, OIDCProxyOAuth2Method, OIDCProxyDeployment, OIDCConfigLambdaPermission, OIDCProxyLambdaPermission, OIDCProxyBasePathMapping
  OIDCProxyAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-oidc-proxy"
      Description: API Gateway to proxy OIDC requests
      EndpointConfiguration:
        Types:
          - REGIONAL

  # OIDCProxyWellKnownResource - API Gateway resource for .well-known path
  # Depends on: OIDCProxyAPI
  # Dependents: OIDCProxyOpenIDResource
  OIDCProxyWellKnownResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      ParentId: !GetAtt OIDCProxyAPI.RootResourceId
      PathPart: ".well-known"

  # OIDCProxyOpenIDResource - API Gateway resource for OpenID configuration
  # Depends on: OIDCProxyAPI, OIDCProxyWellKnownResource
  # Dependents: OIDCProxyConfigMethod
  OIDCProxyOpenIDResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      ParentId: !Ref OIDCProxyWellKnownResource
      PathPart: "openid-configuration"

  # OIDCProxyConfigMethod - API Gateway method for OIDC configuration endpoint
  # Depends on: OIDCProxyAPI, OIDCProxyOpenIDResource, OIDCConfigLambda
  # Dependents: OIDCProxyDeployment
  OIDCProxyConfigMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      ResourceId: !Ref OIDCProxyOpenIDResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OIDCConfigLambda.Arn}/invocations"

  # OIDCProxyOAuth2Resource - API Gateway resource for OAuth2 endpoints
  # Depends on: OIDCProxyAPI
  # Dependents: OIDCProxyOAuth2ProxyResource
  OIDCProxyOAuth2Resource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      ParentId: !GetAtt OIDCProxyAPI.RootResourceId
      PathPart: "oauth2"

  # OIDCProxyOAuth2ProxyResource - API Gateway resource with greedy path for OAuth2 endpoints
  # Depends on: OIDCProxyAPI, OIDCProxyOAuth2Resource
  # Dependents: OIDCProxyOAuth2Method
  OIDCProxyOAuth2ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      ParentId: !Ref OIDCProxyOAuth2Resource
      PathPart: "{proxy+}"

  # OIDCProxyOAuth2Method - API Gateway method for OAuth2 endpoint proxying
  # Depends on: OIDCProxyAPI, OIDCProxyOAuth2ProxyResource, OIDCProxyLambda
  # Dependents: OIDCProxyDeployment
  OIDCProxyOAuth2Method:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      ResourceId: !Ref OIDCProxyOAuth2ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OIDCProxyLambda.Arn}/invocations"

  # OIDCProxyDeployment - API Gateway deployment for OIDC proxy
  # Depends on: OIDCProxyConfigMethod, OIDCProxyOAuth2Method, OIDCProxyAPI
  # Dependents: OIDCProxyBasePathMapping
  OIDCProxyDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - OIDCProxyConfigMethod
      - OIDCProxyOAuth2Method
    Properties:
      RestApiId: !Ref OIDCProxyAPI
      StageName: prod

  # OIDCConfigLambdaPermission - Permission for API Gateway to invoke OIDC config Lambda
  # Depends on: OIDCConfigLambda, OIDCProxyAPI
  OIDCConfigLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OIDCConfigLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${OIDCProxyAPI}/*/GET/.well-known/openid-configuration"

  # OIDCProxyLambdaPermission - Permission for API Gateway to invoke OAuth2 proxy Lambda
  # Depends on: OIDCProxyLambda, OIDCProxyAPI
  OIDCProxyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OIDCProxyLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${OIDCProxyAPI}/*/*"

  # OIDCProxyDomain - Custom domain for OIDC proxy API Gateway
  # Depends on: NewCertificate
  # Dependents: OIDCProxyBasePathMapping, DNSRecordAuth, HTTPSListener
  OIDCProxyDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Sub "auth.${DomainName}"
      RegionalCertificateArn: !If
        - UseExistingCertificate
        - !Ref ExistingCertificateArn
        - !Ref NewCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: TLS_1_2

  # OIDCProxyBasePathMapping - Maps OIDC proxy domain to API Gateway stage
  # Depends on: OIDCProxyDomain, OIDCProxyAPI, OIDCProxyDeployment
  OIDCProxyBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref OIDCProxyDomain
      RestApiId: !Ref OIDCProxyAPI
      Stage: prod
      
  # OIDCProxyRole - IAM role for OIDC proxy Lambda function
  # Dependents: OIDCProxyLambda
  OIDCProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # OIDCProxyLambda - Lambda function to proxy OAuth2 requests to Cognito
  # Depends on: OIDCProxyRole, UserPool
  # Dependents: OIDCProxyOAuth2Method, OIDCProxyLambdaPermission
  OIDCProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-oidc-proxy'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt OIDCProxyRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          REGION: !Ref AWS::Region
          DOMAIN_NAME: !Sub "auth.${DomainName}"
          COGNITO_DOMAIN: !Ref CognitoDomainName
      Code:
        ZipFile: |
          import json
          import urllib.request
          import os
          import boto3
          
          def lambda_handler(event, context):
              region = os.environ['REGION']
              user_pool_id = os.environ['USER_POOL_ID']
              domain_name = os.environ['DOMAIN_NAME']
              cognito_domain = os.environ['COGNITO_DOMAIN']
              
              # Get the path from the event
              path = event.get('path', '')
              method = event.get('httpMethod', 'GET')
              query_params = event.get('queryStringParameters', {})
              headers = event.get('headers', {})
              body = event.get('body', '')
              
              # Map paths to Cognito endpoints
              if path == '/.well-known/openid-configuration':
                  # OIDC Discovery endpoint
                  cognito_url = f"https://cognito-idp.{region}.amazonaws.com/{user_pool_id}/.well-known/openid-configuration"
                  
                  try:
                      # Get the OIDC configuration from Cognito
                      req = urllib.request.Request(cognito_url)
                      response = urllib.request.urlopen(req)
                      config = json.loads(response.read().decode('utf-8'))
                      
                      # Replace Cognito URLs with custom domain URLs
                      for key in config:
                          if isinstance(config[key], str) and 'cognito-idp' in config[key]:
                              config[key] = config[key].replace(
                                  f"cognito-idp.{region}.amazonaws.com/{user_pool_id}",
                                  domain_name
                              )
                      
                      return {
                          'statusCode': 200,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*'
                          },
                          'body': json.dumps(config)
                      }
                  except Exception as e:
                      print(f'Error: {str(e)}')
                      return {
                          'statusCode': 500,
                          'body': json.dumps({'error': str(e)})
                      }
              elif path == '/oauth2/token':
                  # Token endpoint
                  cognito_url = f"https://{cognito_domain}.auth.{region}.amazoncognito.com/oauth2/token"
                  return proxy_request(cognito_url, method, headers, query_params, body)
              elif path == '/oauth2/userInfo':
                  # UserInfo endpoint
                  cognito_url = f"https://{cognito_domain}.auth.{region}.amazoncognito.com/oauth2/userInfo"
                  return proxy_request(cognito_url, method, headers, query_params, body)
              elif path == '/oauth2/authorize':
                  # Authorization endpoint - redirect instead of proxy
                  query_string = ''
                  if query_params:
                      query_string = '?' + '&'.join([f"{k}={v}" for k, v in query_params.items()])
                  
                  cognito_url = f"https://{cognito_domain}.auth.{region}.amazoncognito.com/oauth2/authorize{query_string}"
                  
                  return {
                      'statusCode': 302,
                      'headers': {
                          'Location': cognito_url
                      },
                      'body': ''
                  }
              elif path == '/oauth2/revoke':
                  # Revocation endpoint
                  cognito_url = f"https://{cognito_domain}.auth.{region}.amazoncognito.com/oauth2/revoke"
                  return proxy_request(cognito_url, method, headers, query_params, body)
              
              # Handle other OIDC endpoints if needed
              return {
                  'statusCode': 404,
                  'body': json.dumps({'error': 'Not Found'})
              }
              
          def proxy_request(url, method, headers, query_params, body):
              try:
                  # Build query string
                  query_string = ''
                  if query_params:
                      query_string = '?' + '&'.join([f"{k}={v}" for k, v in query_params.items()])
                  
                  # Create request
                  req = urllib.request.Request(url + query_string, method=method)
                  
                  # Add headers
                  for header, value in headers.items():
                      if header.lower() not in ['host', 'content-length']:
                          req.add_header(header, value)
                  
                  # Add body for POST/PUT requests
                  if method in ['POST', 'PUT'] and body:
                      req.data = body.encode('utf-8')
                  
                  # Send request
                  response = urllib.request.urlopen(req)
                  
                  # Get response
                  response_body = response.read().decode('utf-8')
                  response_headers = dict(response.getheaders())
                  
                  # Return response
                  return {
                      'statusCode': response.status,
                      'headers': response_headers,
                      'body': response_body
                  }
              except Exception as e:
                  print(f'Error: {str(e)}')
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

 

  # ALBAuthorizerRole - IAM role for API Gateway Lambda authorizer
  # Dependents: ALBAuthorizerLambda
  ALBAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoTokenValidation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:GetUser
                Resource: '*'

  # ALBAuthorizerLambda - Lambda authorizer for API Gateway JWT validation
  # Depends on: ALBAuthorizerRole, UserPool
  # Dependents: APIGatewayAuthorizer, APIGatewayAuthorizerRole, ALBAuthorizerPermission
  ALBAuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-alb-authorizer'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt ALBAuthorizerRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import base64
          import urllib.request
          import os
          
          def lambda_handler(event, context):
              try:
                  # Extract token from Authorization header
                  auth_header = event['headers'].get('authorization', '')
                  if not auth_header.startswith('Bearer '):
                      raise Exception('Unauthorized')
                  
                  token = auth_header.split(' ')[1]
                  
                  # Basic JWT validation - decode payload without verification
                  # In production, you'd want full JWT verification
                  try:
                      # Split JWT into parts
                      parts = token.split('.')
                      if len(parts) != 3:
                          raise Exception('Invalid token format')
                      
                      # Decode payload (add padding if needed)
                      payload_b64 = parts[1]
                      # Add padding if needed
                      payload_b64 += '=' * (4 - len(payload_b64) % 4)
                      payload_json = base64.b64decode(payload_b64).decode('utf-8')
                      payload = json.loads(payload_json)
                      
                      # Basic validation
                      region = os.environ['REGION']
                      user_pool_id = os.environ['USER_POOL_ID']

                      # Note: issuer is the default Cognito URL, not the custom domain
                      expected_iss = f'https://cognito-idp.{region}.amazonaws.com/{user_pool_id}'
                      
                      if payload.get('iss') != expected_iss:
                          raise Exception('Invalid issuer')
                      
                      # Check if token is expired (basic check)
                      import time
                      if payload.get('exp', 0) < time.time():
                          raise Exception('Token expired')
                      
                      # Create broader resource ARN for API Gateway
                      method_arn = event['methodArn']
                      # Replace specific method/resource with wildcard
                      # e.g., arn:aws:execute-api:region:account:api-id/stage/method/resource -> arn:aws:execute-api:region:account:api-id/stage/*/*
                      arn_parts = method_arn.split('/')
                      if len(arn_parts) >= 3:
                          resource_arn = '/'.join(arn_parts[:2]) + '/*/*'
                      else:
                          resource_arn = method_arn + '/*'
                      
                      return {
                          'principalId': payload.get('sub', 'user'),
                          'policyDocument': {
                              'Version': '2012-10-17',
                              'Statement': [
                                  {
                                      'Action': 'execute-api:Invoke',
                                      'Effect': 'Allow',
                                      'Resource': resource_arn
                                  }
                              ]
                          },
                          'context': {
                              'userId': payload.get('sub'),
                              'username': payload.get('cognito:username', payload.get('email', 'unknown'))
                          }
                      }
                      
                  except Exception as decode_error:
                      print(f'Token decode error: {str(decode_error)}')
                      raise Exception('Unauthorized')
                  
              except Exception as e:
                  print(f'Authorization error: {str(e)}')
                  raise Exception('Unauthorized')

  # APIGateway - API Gateway for authenticated SysML v2 API access
  # Dependents: APIGatewayAuthorizer, APIGatewayProxyResource, APIGatewayProxyMethod, APIGatewayDeployment, APIGatewayDomain, APIGatewayBasePathMapping, ALBAuthorizerPermission
  APIGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-api-gateway"
      Description: API Gateway with Lambda authorizer for SysML v2 API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # APIGatewayAuthorizer - Lambda authorizer for API Gateway
  # Depends on: APIGateway, ALBAuthorizerLambda, APIGatewayAuthorizerRole
  # Dependents: APIGatewayProxyMethod
  APIGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId: !Ref APIGateway
      Name: CognitoTokenAuthorizer
      Type: REQUEST
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ALBAuthorizerLambda.Arn}/invocations"
      AuthorizerCredentials: !GetAtt APIGatewayAuthorizerRole.Arn
      IdentitySource: method.request.header.Authorization

  # APIGatewayAuthorizerRole - IAM role for API Gateway to invoke Lambda authorizer
  # Depends on: ALBAuthorizerLambda
  # Dependents: APIGatewayAuthorizer
  APIGatewayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ALBAuthorizerLambda.Arn

  # APIGatewayProxyResource - API Gateway resource with greedy path parameter
  # Depends on: APIGateway
  # Dependents: APIGatewayProxyMethod
  APIGatewayProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref APIGateway
      ParentId: !GetAtt APIGateway.RootResourceId
      PathPart: "{proxy+}"

  # APIGatewayProxyMethod - API Gateway method proxying to ALB with authorization
  # Depends on: APIGateway, APIGatewayProxyResource, APIGatewayAuthorizer, ApplicationLoadBalancer
  # Dependents: APIGatewayDeployment
  APIGatewayProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref APIGateway
      ResourceId: !Ref APIGatewayProxyResource
      HttpMethod: ANY
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref APIGatewayAuthorizer
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub "http://${ApplicationLoadBalancer.DNSName}:8080/{proxy}"
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy

  # APIGatewayDeployment - API Gateway deployment for main API
  # Depends on: APIGatewayProxyMethod, APIGateway
  # Dependents: APIGatewayBasePathMapping
  APIGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: APIGatewayProxyMethod
    Properties:
      RestApiId: !Ref APIGateway
      StageName: prod

  # ALBAuthorizerPermission - Permission for API Gateway to invoke Lambda authorizer
  # Depends on: ALBAuthorizerLambda, APIGateway
  ALBAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ALBAuthorizerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${APIGateway}/*/*"

  # AdminUserCreatorRole - IAM role for admin user creation Lambda
  # Depends on: UserPool
  # Dependents: AdminUserCreatorLambda
  AdminUserCreatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAdminAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                Resource: !GetAtt UserPool.Arn

  # AdminUserCreatorLambda - Lambda function to create initial admin user
  # Depends on: AdminUserCreatorRole
  # Dependents: AdminUser
  AdminUserCreatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-admin-user-creator'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt AdminUserCreatorRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          def lambda_handler(event, context):
              cognito = boto3.client('cognito-idp')
              
              try:
                  if event['RequestType'] == 'Create':
                      user_pool_id = event['ResourceProperties']['UserPoolId']
                      email = event['ResourceProperties']['Email']
                      password = event['ResourceProperties'].get('Password', '')
                      
                      # Check if user already exists
                      user_exists = False
                      try:
                          cognito.admin_get_user(
                              UserPoolId=user_pool_id,
                              Username=email
                          )
                          user_exists = True
                          print(f'User {email} already exists')
                          
                          # If password provided, update existing user's password
                          if password:
                              cognito.admin_set_user_password(
                                  UserPoolId=user_pool_id,
                                  Username=email,
                                  Password=password,
                                  Permanent=True
                              )
                              print(f'Updated password for existing user {email}')
                          
                      except cognito.exceptions.UserNotFoundException:
                          user_exists = False
                      
                      if not user_exists:
                          # User doesn't exist, create it
                          full_name = event['ResourceProperties'].get('FullName', '')
                          user_attributes = [
                              {'Name': 'email', 'Value': email},
                              {'Name': 'email_verified', 'Value': 'true'}
                          ]
                          if full_name:
                              user_attributes.append({'Name': 'name', 'Value': full_name})
                          
                          create_params = {
                              'UserPoolId': user_pool_id,
                              'Username': email,
                              'UserAttributes': user_attributes,
                              'ForceAliasCreation': True
                          }
                          
                          # If password provided, suppress email and set permanent password
                          if password:
                              create_params['MessageAction'] = 'SUPPRESS'
                              create_params['TemporaryPassword'] = password
                          else:
                              create_params['DesiredDeliveryMediums'] = ['EMAIL']
                          
                          cognito.admin_create_user(**create_params)
                          
                          # If password provided, set it as permanent
                          if password:
                              cognito.admin_set_user_password(
                                  UserPoolId=user_pool_id,
                                  Username=email,
                                  Password=password,
                                  Permanent=True
                              )
                              print(f'User {email} created with permanent password')
                          else:
                              print(f'User {email} created with temporary password via email')
                      
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Username': email})
                  
                  elif event['RequestType'] == 'Delete':
                      user_pool_id = event['ResourceProperties']['UserPoolId']
                      email = event['ResourceProperties']['Email']
                      
                      try:
                          cognito.admin_delete_user(
                              UserPoolId=user_pool_id,
                              Username=email
                          )
                      except:
                          pass
                      
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  # AdminUser - Custom resource to create initial admin user in Cognito
  # Depends on: AdminUserCreatorLambda, UserPool
  AdminUser:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt AdminUserCreatorLambda.Arn
      UserPoolId: !Ref UserPool
      FullName: !Ref AdminFullName
      Email: !Ref AdminEmail
      Password: !Ref AdminPassword

  # UserPoolClientAPI - Cognito User Pool client for programmatic API access
  # Depends on: UserPool
  UserPoolClientAPI:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-API-Client"
      GenerateSecret: true
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "http://localhost:3000/callback"
        - !Sub "https://${DomainName}/oauth2/idpresponse"
        - !Sub "https://web.${DomainName}/oauth2/idpresponse"
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

