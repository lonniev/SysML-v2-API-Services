  # Lambda function to wait for Cognito domain verification
  CognitoDomainVerifierRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPoolDomain
                Resource: '*'

  CognitoDomainVerifierLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-domain-verifier'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt CognitoDomainVerifierRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          import time
          
          def lambda_handler(event, context):
              cognito = boto3.client('cognito-idp')
              
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      domain = event['ResourceProperties']['Domain']
                      max_attempts = 60  # 5 minutes with 5 second intervals
                      
                      for attempt in range(max_attempts):
                          try:
                              response = cognito.describe_user_pool_domain(
                                  Domain=domain
                              )
                              
                              status = response['DomainDescription'].get('Status')
                              print(f"Attempt {attempt+1}: Domain status is {status}")
                              
                              if status == 'ACTIVE':
                                  print(f"Domain {domain} is now active")
                                  cfnresponse.send(event, context, cfnresponse.SUCCESS, 
                                                 {'Message': f"Domain {domain} is active"})
                                  return
                              
                          except Exception as e:
                              print(f"Error checking domain status: {str(e)}")
                          
                          # Wait before next attempt
                          time.sleep(5)
                      
                      # If we get here, verification timed out
                      cfnresponse.send(event, context, cfnresponse.FAILED, 
                                     {'Message': f"Domain {domain} verification timed out"})
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  CognitoDomainVerifier:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: DNSRecordAuth
    Properties:
      ServiceToken: !GetAtt CognitoDomainVerifierLambda.Arn
      Domain: !Sub "auth.${DomainName}"
      
  # Lambda function to proxy OIDC discovery requests
  OIDCProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  OIDCProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-oidc-proxy'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt OIDCProxyRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          REGION: !Ref AWS::Region
          DOMAIN_NAME: !Sub "auth.${DomainName}"
      Code:
        ZipFile: |
          import json
          import urllib.request
          import os
          import boto3
          
          def lambda_handler(event, context):
              region = os.environ['REGION']
              user_pool_id = os.environ['USER_POOL_ID']
              domain_name = os.environ['DOMAIN_NAME']
              
              # Get the path from the event
              path = event.get('path', '')
              
              # Map the custom domain URL to the Cognito URL
              if path == '/.well-known/openid-configuration':
                  cognito_url = f"https://cognito-idp.{region}.amazonaws.com/{user_pool_id}/.well-known/openid-configuration"
                  
                  try:
                      # Get the OIDC configuration from Cognito
                      req = urllib.request.Request(cognito_url)
                      response = urllib.request.urlopen(req)
                      config = json.loads(response.read().decode('utf-8'))
                      
                      # Replace Cognito URLs with custom domain URLs
                      for key in config:
                          if isinstance(config[key], str) and 'cognito-idp' in config[key]:
                              config[key] = config[key].replace(
                                  f"cognito-idp.{region}.amazonaws.com/{user_pool_id}",
                                  domain_name
                              )
                      
                      return {
                          'statusCode': 200,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*'
                          },
                          'body': json.dumps(config)
                      }
                  except Exception as e:
                      print(f'Error: {str(e)}')
                      return {
                          'statusCode': 500,
                          'body': json.dumps({'error': str(e)})
                      }
              
              # Handle other OIDC endpoints if needed
              return {
                  'statusCode': 404,
                  'body': json.dumps({'error': 'Not Found'})
              }

  OIDCProxyAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-oidc-proxy"
      Description: API Gateway to proxy OIDC discovery requests
