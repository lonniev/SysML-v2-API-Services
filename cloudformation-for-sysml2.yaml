# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/goformation/master/schema/cloudformation.schema.json

AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Marketplace Service with Aurora PostgreSQL, ECS Fargate, HTTPS ALB, and Secrets Manager (Custom Defaults)

Parameters:
  DBName:
    Type: String
    Default: sysml2
    Description: Name of the initial database (leave as sysml2 unless you have a specific reason to change it)
  DBPassword:
    Type: String
    NoEcho: true
    Default: mysecretpassword
    Description: Password for the database (stored in Secrets Manager) (leave as mysecretpassword unless you have a specific reason to change it)
  DBInstanceClass:
    Type: String
    Default: db.t3.medium
    Description: DB instance class (db.t3.medium is a good starting point)
  ECSImage:
    Type: String
    Description: Docker image for the SysMLv2 API server (leave as is stated)
    Default: '709825985650.dkr.ecr.us-east-1.amazonaws.com/sysml-at-your-service/sysml-at-your-service-image:0.1.0-20250606.1'
  DomainName:
    Type: String
    Description: Domain name for the application (must change to your own DNS domain)
    Default: 'sysml-v2-api.digitalthread.link'
  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for your domain (leave empty to auto-discover from domain name)
    Default: ""
  CognitoUserLimit:
    Type: Number
    Default: 5
    Description: Maximum number of users allowed in the Cognito User Pool
  MarketplaceProductCode:
    Type: String
    Description: AWS Marketplace Product Code for entitlement checking
    Default: ""
  AdminFullName:
    Type: String
    Default: "SysML v2 Administrator"
    Description: Full name for the initial admin user (displayed name, not login username)
  AdminEmail:
    Type: String
    Description: Email address for the initial admin user (enter your admin's own real email address). Necessary to receive the initial password.
  AdminPassword:
    Type: String
    NoEcho: true
    Description: Password for the initial admin user (leave empty to use temporary password via email). Resets any existing password.
    Default: ""
    MinLength: 0
    MaxLength: 256
  CertificateOption:
    Type: String
    Default: New
    AllowedValues: [Existing, New]
    Description: Choose to use an existing ACM certificate or request a new one (recommended to use New)
  ExistingCertificateArn:
    Type: String
    Description: ARN of an existing ACM certificate (required if CertificateOption is Existing)
    Default: ''
  HttpPort:
    Type: Number
    Default: 80
    Description: Port for HTTP listener (external ALB) (leave as 80)
  HttpsPort:
    Type: Number
    Default: 443
    Description: Port for HTTPS listener (external ALB) (leave as 443)
  AppPort:
    Type: Number
    Default: 9000
    Description: Port for application container (internal) (leave as 9000)
  PostgresPort:
    Type: Number
    Default: 5432
    Description: Port for PostgreSQL database (internal) (leave as 5432)
  SecretsOption:
    Type: String
    Default: CreateNew
    AllowedValues: [CreateNew, UseExisting]
    Description: Choose to create a new secret or use an existing one for database credentials (recommended to use CreateNew)
  ExistingSecretArn:
    Type: String
    Description: ARN of an existing secret (required if SecretsOption is UseExisting)
    Default: 'arn:aws:secretsmanager:us-east-1:123456789012:secret:dummy'

Conditions:
  CreateNewSecret: !Equals [!Ref SecretsOption, CreateNew]
  UseExistingCertificate: !Equals [!Ref CertificateOption, Existing]
  CreateNewCertificate: !Equals [!Ref CertificateOption, New]
  EnableMarketplaceCheck: !Not [!Equals [!Ref MarketplaceProductCode, ""]]
  AutoDiscoverHostedZone: !Equals [!Ref HostedZoneId, ""]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: AppVPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: PublicSubnet2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: PrivateSubnet2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: AppIGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PublicRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn: PublicRoute
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn: PublicRoute
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora cluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref PostgresPort
          ToPort: !Ref PostgresPort
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateNewSecret
    Properties:
      Description: Credentials for Aurora PostgreSQL database
      SecretString: !Sub '{"username": "postgres", "password": "${DBPassword}"}'
      Tags:
        - Key: Name
          Value: AuroraDBCredentials

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '13.12'
      MasterUsername: !If 
        - CreateNewSecret
        - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
        - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:username}}'
      MasterUserPassword: !If 
        - CreateNewSecret
        - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
        - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:password}}'
      DatabaseName: !Ref DBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 03:00-04:00
      PreferredMaintenanceWindow: sun:05:00-sun:06:00
      Port: !Ref PostgresPort

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: !Ref DBInstanceClass
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false

  # Create new certificate if requested
  NewCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateNewCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "web.${DomainName}"
        - !Sub "*.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If
            - AutoDiscoverHostedZone
            - !GetAtt HostedZoneDiscovery.HostedZoneId
            - !Ref HostedZoneId
        - DomainName: !Sub "web.${DomainName}"
          HostedZoneId: !If
            - AutoDiscoverHostedZone
            - !GetAtt HostedZoneDiscovery.HostedZoneId
            - !Ref HostedZoneId
        - DomainName: !Sub "auth.${DomainName}"
          HostedZoneId: !If
            - AutoDiscoverHostedZone
            - !GetAtt HostedZoneDiscovery.HostedZoneId
            - !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-Certificate"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref HttpPort
          ToPort: !Ref HttpPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref HttpsPort
          ToPort: !Ref HttpsPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: AppCluster

  # CloudWatch Log Groups for services
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/sysml-v2-api
      RetentionInDays: 14

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: app-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: app-container
          Image: !Ref ECSImage
          PortMappings:
            - ContainerPort: !Ref AppPort
              HostPort: !Ref AppPort
          Environment:
            - Name: DB_HOST
              Value: !GetAtt AuroraCluster.Endpoint.Address
            - Name: DB_PORT
              Value: !Ref PostgresPort
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: !If 
                - CreateNewSecret
                - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
                - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:username}}'
            - Name: DB_PASSWORD
              Value: !If 
                - CreateNewSecret
                - !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
                - !Sub '{{resolve:secretsmanager:${ExistingSecretArn}:SecretString:password}}'
            - Name: JAVA_OPTS
              Value: !If
                - CreateNewSecret
                - !Sub "-Ddb.host=${AuroraCluster.Endpoint.Address} -Ddb.port=${PostgresPort} -Ddb.name=${DBName} -Ddb.user={{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}} -Ddb.password={{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
                - !Sub "-Ddb.host=${AuroraCluster.Endpoint.Address} -Ddb.port=${PostgresPort} -Ddb.name=${DBName} -Ddb.user={{resolve:secretsmanager:${ExistingSecretArn}:SecretString:username}} -Ddb.password={{resolve:secretsmanager:${ExistingSecretArn}:SecretString:password}}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: sysml-v2-api

  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowRDSAndSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds:*
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !If 
                  - CreateNewSecret
                  - !Ref DatabaseSecret
                  - !Ref ExistingSecretArn
        - PolicyName: AllowECSExec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: HTTPSListener
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: AppService
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: app-container
          ContainerPort: !Ref AppPort
          TargetGroupArn: !Ref TargetGroup

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: 
      - PublicSubnetRouteTableAssociation1
      - PublicSubnetRouteTableAssociation2
    Properties:
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Type: application

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: !Ref AppPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckPort: !Sub '${AppPort}'
      HealthCheckIntervalSeconds: 300
      HealthCheckTimeoutSeconds: 60
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      Matcher:
        HttpCode: 200-499
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 600
        - Key: slow_start.duration_seconds
          Value: 300

      
  # Cognito Custom Domain for OIDC endpoints
  CognitoCustomDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "auth.${DomainName}"
      UserPoolId: !Ref UserPool
      CustomDomainConfig:
        CertificateArn: !If
          - UseExistingCertificate
          - !Ref ExistingCertificateArn
          - !Ref NewCertificate

  ALBAuthenticationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticloadbalancing.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:GetSigningCertificate
                  - cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt UserPool.Arn

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - CognitoCustomDomain
      - CognitoDomainVerifier
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref HttpsPort
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If
            - UseExistingCertificate
            - !Ref ExistingCertificateArn
            - !Ref NewCertificate
      DefaultActions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !GetAtt UserPool.Arn
            UserPoolClientId: !Ref UserPoolClient
            UserPoolDomain: !Sub "auth.${DomainName}"
            OnUnauthenticatedRequest: authenticate
            SessionCookieName: AWSELBAuthSessionCookie
            SessionTimeout: 3600
            Scope: "openid email profile"
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref TargetGroup

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref HttpPort
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: !Sub '${HttpsPort}'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  # HTTP Listener for API Gateway (no auth)
  HTTPListenerAPIGateway:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Lambda function to discover HostedZoneId
  HostedZoneDiscoveryRole:
    Type: AWS::IAM::Role
    Condition: AutoDiscoverHostedZone
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Route53Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                Resource: '*'

  HostedZoneDiscoveryLambda:
    Type: AWS::Lambda::Function
    Condition: AutoDiscoverHostedZone
    Properties:
      FunctionName: !Sub '${AWS::StackName}-hosted-zone-discovery'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt HostedZoneDiscoveryRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          def lambda_handler(event, context):
              route53 = boto3.client('route53')
              
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      domain_name = event['ResourceProperties']['DomainName']
                      
                      # Extract base domain (e.g., digitalthread.link from sysml-v2-api.digitalthread.link)
                      parts = domain_name.split('.')
                      if len(parts) >= 2:
                          base_domain = '.'.join(parts[-2:]) + '.'
                      else:
                          base_domain = domain_name + '.'
                      
                      # List hosted zones and find matching one
                      response = route53.list_hosted_zones()
                      
                      for zone in response['HostedZones']:
                          if zone['Name'] == base_domain:
                              hosted_zone_id = zone['Id'].split('/')[-1]
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, 
                                             {'HostedZoneId': hosted_zone_id})
                              return
                      
                      # If no zone found, return error
                      cfnresponse.send(event, context, cfnresponse.FAILED, 
                                     {}, f'No hosted zone found for domain {base_domain}')
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  HostedZoneDiscovery:
    Type: AWS::CloudFormation::CustomResource
    Condition: AutoDiscoverHostedZone
    Properties:
      ServiceToken: !GetAtt HostedZoneDiscoveryLambda.Arn
      DomainName: !Ref DomainName

  # DNS Record for API (primary) - points to API Gateway
  DNSRecordAPI:
    Type: AWS::Route53::RecordSet
    DependsOn: APIGateway
    Properties:
      HostedZoneId: !If
        - AutoDiscoverHostedZone
        - !GetAtt HostedZoneDiscovery.HostedZoneId
        - !Ref HostedZoneId
      Name: !Ref DomainName
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Sub "${APIGateway}.execute-api.${AWS::Region}.amazonaws.com"

  # DNS Record for Web UI - points to ALB
  DNSRecordWeb:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - AutoDiscoverHostedZone
        - !GetAtt HostedZoneDiscovery.HostedZoneId
        - !Ref HostedZoneId
      Name: !Sub "web.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # Lambda function for Marketplace entitlement checking
  MarketplaceEntitlementLambdaRole:
    Type: AWS::IAM::Role
    Condition: EnableMarketplaceCheck
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MarketplaceAndECSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aws-marketplace:GetEntitlements
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'

  MarketplaceEntitlementLambda:
    Type: AWS::Lambda::Function
    Condition: EnableMarketplaceCheck
    Properties:
      FunctionName: !Sub '${AWS::StackName}-marketplace-entitlement-check'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt MarketplaceEntitlementLambdaRole.Arn
      Environment:
        Variables:
          PRODUCT_CODE: !Ref MarketplaceProductCode
          ECS_CLUSTER: !Ref ECSCluster
          ECS_SERVICE: !Ref ECSService
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          def lambda_handler(event, context):
              marketplace = boto3.client('marketplace-entitlement')
              ecs = boto3.client('ecs')
              
              product_code = os.environ['PRODUCT_CODE']
              cluster_name = os.environ['ECS_CLUSTER']
              service_name = os.environ['ECS_SERVICE']
              
              try:
                  # Check entitlements
                  response = marketplace.get_entitlements(ProductCode=product_code)
                  has_entitlement = len(response.get('Entitlements', [])) > 0
                  
                  # Get current service status
                  service_response = ecs.describe_services(
                      cluster=cluster_name,
                      services=[service_name]
                  )
                  
                  current_count = service_response['services'][0]['desiredCount']
                  
                  if has_entitlement and current_count == 0:
                      # Resume service
                      ecs.update_service(
                          cluster=cluster_name,
                          service=service_name,
                          desiredCount=1
                      )
                      print('Service resumed - valid entitlement found')
                  elif not has_entitlement and current_count > 0:
                      # Suspend service
                      ecs.update_service(
                          cluster=cluster_name,
                          service=service_name,
                          desiredCount=0
                      )
                      print('Service suspended - no valid entitlement')
                  
                  return {'statusCode': 200, 'body': json.dumps('Entitlement check completed')}
              except Exception as e:
                  print(f'Error: {str(e)}')
                  raise e

  MarketplaceEntitlementSchedule:
    Type: AWS::Events::Rule
    Condition: EnableMarketplaceCheck
    Properties:
      Description: 'Trigger marketplace entitlement check every hour'
      ScheduleExpression: 'rate(1 hour)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt MarketplaceEntitlementLambda.Arn
          Id: 'MarketplaceEntitlementTarget'

  MarketplaceEntitlementLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: EnableMarketplaceCheck
    Properties:
      FunctionName: !Ref MarketplaceEntitlementLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MarketplaceEntitlementSchedule.Arn

  # Lambda function for Cognito PreSignUp trigger
  CognitoPreSignUpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUserPoolAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  CognitoPreSignUpLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-cognito-presignup'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt CognitoPreSignUpLambdaRole.Arn
      Environment:
        Variables:
          USER_LIMIT: !Ref CognitoUserLimit
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          
          def lambda_handler(event, context):
              cognito = boto3.client('cognito-idp')
              user_pool_id = event['userPoolId']
              user_limit = int(os.environ['USER_LIMIT'])
              
              try:
                  response = cognito.list_users(UserPoolId=user_pool_id)
                  current_user_count = len(response['Users'])
                  
                  if current_user_count >= user_limit:
                      raise Exception(f'User limit of {user_limit} has been reached')
                  
                  return event
              except Exception as e:
                  print(f'Error: {str(e)}')
                  raise e

  CognitoPreSignUpLambdaPermission:
